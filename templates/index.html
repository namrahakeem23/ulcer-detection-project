<!DOCTYPE html>
<html lang="en">

<head>
    <!DOCTYPE html>
    <html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>AI Ulcer Detection System | MedTech AI</title>
        <style>
            /* ADD THIS STYLE TO PREVENT CONTENT HIDING UNDER NAVBAR */
            body {
                padding-top: 80px;
                margin: 0;
            }

            /* Make sure sections don't get extra padding */
            section {
                scroll-margin-top: 80px;
            }
        </style>
        <!-- CSS Files -->
        <link rel="stylesheet" href="/static/css/style.css">
        <link rel="stylesheet" href="/static/css/header.css">
        <link rel="stylesheet" href="/static/css/hero.css">
        <link rel="stylesheet" href="/static/css/how-it-works.css">
        <link rel="stylesheet" href="/static//css/features.css">
        <link rel="stylesheet" href="/static/css/diagnosis.css">
        <link rel="stylesheet" href="/static/css/about.css">
        <link rel="stylesheet" href="/static/css/style.css">
        <link rel="stylesheet" href="/static/css/login.css">
        <link rel="stylesheet" href="/static/css/responsive.css">
        <!-- Font Awesome -->
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
        <!-- Google Fonts -->
        <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
            rel="stylesheet">
    </head>

<body>

    <!-- Include Header -->
    <div id="header-container"></div>

    <!-- PAGE 1: Hero Section -->
    <div id="hero-container"></div>

    <!-- PAGE 2: How It Works Section -->
    <div id="how-it-works-container"></div>

    <!-- PAGE 3: Features Section -->
    <div id="features-container"></div>

    <!-- PAGE 4: Diagnosis Section -->
    <div id="diagnosis-container"></div>

    <!-- PAGE 5: About Section -->
    <div id="about-container"></div>

    <!-- Footer -->
    <div id="footer-container"></div>

    <!-- Login/Signup Modal -->
    <div class="modal" id="authModal">
        <div class="modal-content">
            <button class="modal-close">&times;</button>

            <div class="auth-tabs">
                <button class="auth-tab active" id="loginTab">Login</button>
                <button class="auth-tab" id="signupTab">Sign Up</button>
            </div>

            <!-- Login Form -->
            <form id="loginForm" class="auth-form active">
                <h3>Welcome Back</h3>
                <p>Login to access your account and continue your analysis.</p>

                <div class="form-group">
                    <label for="loginEmail"><i class="fas fa-envelope"></i> Email</label>
                    <input type="email" id="loginEmail" placeholder="Enter your email" required>
                </div>

                <div class="form-group">
                    <label for="loginPassword"><i class="fas fa-lock"></i> Password</label>
                    <input type="password" id="loginPassword" placeholder="Enter your password" required>
                    <span class="password-toggle"><i class="fas fa-eye"></i></span>
                </div>

                <div class="form-options">
                    <label class="remember-me">
                        <input type="checkbox"> Remember me
                    </label>
                    <a href="#" class="forgot-password">Forgot Password?</a>
                </div>

                <button type="submit" class="btn btn-primary btn-block">Login</button>

                <div class="social-login">
                    <p>Or login with</p>
                    <div class="social-buttons">
                        <button type="button" class="btn-social google"><i class="fab fa-google"></i> Google</button>
                        <button type="button" class="btn-social microsoft"><i class="fab fa-microsoft"></i>
                            Microsoft</button>
                    </div>
                </div>
            </form>

            <!-- Signup Form -->
            <form id="signupForm" class="auth-form">
                <h3>Create Account</h3>
                <p>Join us for free and start using AI-powered ulcer detection.</p>

                <div class="form-group">
                    <label for="signupName"><i class="fas fa-user"></i> Full Name</label>
                    <input type="text" id="signupName" placeholder="Enter your full name" required>
                </div>

                <div class="form-group">
                    <label for="signupEmail"><i class="fas fa-envelope"></i> Email</label>
                    <input type="email" id="signupEmail" placeholder="Enter your email" required>
                </div>

                <div class="form-group">
                    <label for="signupPassword"><i class="fas fa-lock"></i> Password</label>
                    <input type="password" id="signupPassword" placeholder="Create a password" required>
                    <span class="password-toggle"><i class="fas fa-eye"></i></span>
                </div>

                <div class="form-group">
                    <label for="confirmPassword"><i class="fas fa-lock"></i> Confirm Password</label>
                    <input type="password" id="confirmPassword" placeholder="Confirm your password" required>
                </div>

                <div class="form-group">
                    <label class="checkbox-label">
                        <input type="checkbox" required> I agree to the <a href="#">Terms of Service</a> and <a
                            href="#">Privacy Policy</a>
                    </label>
                </div>

                <div class="form-group">
                    <label class="checkbox-label">
                        <input type="checkbox"> I want to receive updates and newsletters
                    </label>
                </div>

                <button type="submit" class="btn btn-primary btn-block">Create Account</button>

                <div class="social-login">
                    <p>Or sign up with</p>
                    <div class="social-buttons">
                        <button type="button" class="btn-social google"><i class="fab fa-google"></i> Google</button>
                        <button type="button" class="btn-social microsoft"><i class="fab fa-microsoft"></i>
                            Microsoft</button>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <!-- JavaScript Files -->
    <script src="/static/js/main.js"></script>
    <script src="/static/js/header.js"></script>
    <script src="/static/js/hero.js"></script>
    <script src="/static/js/how-it-works.js"></script>
    <script src="/static/js/features.js"></script>
    <script src="/static/js/diagnosis.js"></script>
    <script src="/static/js/about.js"></script>
    <script src="/static/js/footer.js"></script>
    <script src="/static/js/login.js"></script>
</body>

</html>
