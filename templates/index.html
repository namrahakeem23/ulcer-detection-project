<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Ulcer Detection System | MedTech AI</title>
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Global CSS -->
    <link rel="stylesheet" href="static/css/style.css">
    <link rel="stylesheet" href="static/css/header.css">
    <link rel="stylesheet" href="static/css/home.css">
    <link rel="stylesheet" href="static/css/how-it-works.css">
    <link rel="stylesheet" href="static/css/features.css">
    <link rel="stylesheet" href="static/css/diagnosis.css">
    <link rel="stylesheet" href="static/css/about.css">
    <link rel="stylesheet" href="static/css/contact.css">
    <link rel="stylesheet" href="static/css/login.css">
    <link rel="stylesheet" href="static\css\responsive.css">
</head>
<body>

    <!-- Header Container -->
    <div id="header-container"></div>

    <!-- Home Section -->
    <div id="home-container"></div>

    <!-- How It Works Section -->
    <div id="how-it-works-container"></div>

    <!-- Features Section -->
    <div id="features-container"></div>

    <!-- Diagnosis Section -->
    <div id="diagnosis-container"></div>

    <!-- About Section -->
    <div id="about-container"></div>

    <!-- Contact/Footer Section -->
    <div id="contact-container"></div>

    <!-- Login Modal -->
    <div class="modal" id="authModal">
        <div class="modal-content">
            <button class="modal-close">&times;</button>
            <div class="auth-tabs">
                <button class="auth-tab active" id="loginTab">Login</button>
                <button class="auth-tab" id="signupTab">Sign Up</button>
            </div>
            
            <form id="loginForm" class="auth-form active">
                <h3>Welcome Back</h3>
                <p>Login to access your account.</p>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="loginEmail" placeholder="Enter your email">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="loginPassword" placeholder="Enter your password">
                </div>
                <div class="form-options">
                    <label class="remember-me"><input type="checkbox"> Remember me</label>
                    <a href="#" class="forgot-password">Forgot Password?</a>
                </div>
                <button type="submit" class="btn btn-primary btn-block">Login</button>
                <div class="social-login">
                    <p>Or login with</p>
                    <div class="social-buttons">
                        <button type="button" class="btn-social google"><i class="fab fa-google"></i> Google</button>
                        <button type="button" class="btn-social microsoft"><i class="fab fa-microsoft"></i> Microsoft</button>
                    </div>
                </div>
            </form>
            
            <form id="signupForm" class="auth-form">
                <h3>Create Account</h3>
                <p>Join us for free.</p>
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" id="signupName" placeholder="Enter your full name">
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="signupEmail" placeholder="Enter your email">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="signupPassword" placeholder="Create a password">
                </div>
                <div class="form-group">
                    <label>Confirm Password</label>
                    <input type="password" id="confirmPassword" placeholder="Confirm your password">
                </div>
                <div class="form-group">
                    <label class="checkbox-label"><input type="checkbox"> I agree to the Terms of Service</label>
                </div>
                <button type="submit" class="btn btn-primary btn-block">Create Account</button>
                <div class="social-login">
                    <p>Or sign up with</p>
                    <div class="social-buttons">
                        <button type="button" class="btn-social google"><i class="fab fa-google"></i> Google</button>
                        <button type="button" class="btn-social microsoft"><i class="fab fa-microsoft"></i> Microsoft</button>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <div id="toast" class="toast"></div>

    <!-- JavaScript Files -->
    <script src="static/js/main.js"></script>
    <script src="static/js/header.js"></script>
    <script src="static/js/home.js"></script>
    <script src="static/js/how-it-works.js"></script>
    <script src="static/js/features.js"></script>
    <script src="static/js/diagnosis.js"></script>
    <script src="static/js/about.js"></script>
    <script src="static/js/contact.js"></script>
    <script src="static/js/login.js"></script>
</body>
</html>
