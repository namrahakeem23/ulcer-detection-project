<header class="header">
    <nav class="navbar">
        <div class="logo">
            <i class="fas fa-microscope logo-icon"></i>
            <h2>UlcerDetect <span class="logo-highlight">AI</span></h2>
        </div>

        <ul class="nav-menu">
            <li><a href="#home" class="nav-link" data-section="home">Home</a></li>
            <li><a href="#how-it-works" class="nav-link" data-section="how-it-works">How It Works</a></li>
            <li><a href="#features" class="nav-link" data-section="features">Features</a></li>
            <li><a href="#about" class="nav-link" data-section="about">About</a></li>
            <li><a href="#contact" class="nav-link" data-section="contact">Contact</a></li>
        </ul>

        <div class="nav-buttons">
            {% if current_user.is_authenticated %}
                <div class="user-menu">
                    <button class="btn btn-outline user-menu-btn">
                        <i class="fas fa-user-circle"></i> {{ current_user.username }} <i class="fas fa-chevron-down"></i>
                    </button>
                    <div class="user-dropdown">
                        <a href="/upload"><i class="fas fa-microscope"></i> Diagnosis</a>
                        <a href="/history"><i class="fas fa-history"></i> History</a>
                        <a href="/logout" id="logoutBtn"><i class="fas fa-sign-out-alt"></i> Logout</a>
                    </div>
                </div>
            {% else %}
                <button class="btn btn-outline" id="loginBtn"><i class="fas fa-sign-in-alt"></i> Login</button>
                <button class="btn btn-primary" id="signupBtn"><i class="fas fa-user-plus"></i> Sign Up</button>
            {% endif %}
        </div>

        <div class="hamburger">
            <span class="bar"></span>
            <span class="bar"></span>
            <span class="bar"></span>
        </div>
    </nav>
</header>
